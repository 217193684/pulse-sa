name: Collect data
# Every hour, ask the server to fetch fresh news, trends, Eskom status and GDELT.
# The server address; a repository variable API_URL overrides it.
on:
  schedule: [{ cron: "7 * * * *" }]
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL || 'https://pulse-sa.vercel.app' }}
    steps:
      - name: Trigger collection
        run: |
          code=$(curl -sS -o out.json -w '%{http_code}' --max-time 90 "$API_URL/api/cron/collect")
          cat out.json; echo
          test "$code" = "200"
