name: Videos (manual)
# Makes a few videos now from the newest stories. Normally the always-on Newsroom does this by itself.
# Upload is authorised with this run's GitHub-signed token (id-token), so no secrets are stored.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency: { group: videos, cancel-in-progress: false }
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      API_URL: ${{ vars.API_URL || 'https://pulse-sa.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter
          pip install -q playwright numpy
          python -m playwright install --with-deps chromium
      - name: Collect fresh news first
        # So the videos never depend on the hourly collector having run on time.
        continue-on-error: true
        run: curl -sS --max-time 90 "$API_URL/api/cron/collect" | head -c 400; echo
      - name: Make and upload videos
        run: python video/make.py
