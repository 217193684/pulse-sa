name: Daily videos
# Makes up to 3 short videos a day from the biggest problem stories and uploads them.
# Upload is authorised with this run's GitHub-signed token (id-token), so no secrets are stored.
on:
  schedule: [{ cron: "0 15 * * *" }]   # 17:00 South African time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["video/**", ".github/workflows/videos.yml"]
permissions:
  contents: read
  id-token: write
concurrency: { group: videos, cancel-in-progress: false }
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      API_URL: ${{ vars.API_URL || 'https://pulse-sa.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter
          pip install -q playwright numpy
          python -m playwright install --with-deps chromium
      - name: Make and upload videos
        run: python video/make.py
